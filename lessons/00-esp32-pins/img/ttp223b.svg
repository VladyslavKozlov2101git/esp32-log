<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-label="Будова модуля TTP223B"><style>.lbl{fill:#5a676d;font:12px sans-serif}</style><rect x="0" y="0" width="640" height="660" rx="12" fill="#dde5e3"/>
  <text x="320" y="40" text-anchor="middle" font-family="IBM Plex Sans,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" class="lbl">TTP223B · вигляд з боку деталей</text>
  <rect x="220" y="110" width="200" height="220" rx="10" fill="#b8262b" stroke="#7d1418"/>
  <rect x="262" y="318" width="116" height="14" rx="2" fill="#1a1a1a"/><g class="pin" data-k="0" tabindex="0" role="button" aria-label="Сенсорна зона"><title>Сенсорна зона: Сюди торкаються. Працює і крізь тонкий пластик, скло чи фанеру (до кількох мм), тому модуль можна сховати в корпус. На деяких модулях зона з іншого боку плати.</title>
    <circle cx="285" cy="205" r="52" fill="#d8474b" stroke="#f08d8f" stroke-width="3"/><text x="285" y="209" text-anchor="middle" font-family="IBM Plex Mono,Consolas,monospace" font-size="11" fill="#fff">TOUCH</text><path d="M233 205 H205" fill="none" stroke="#8b979c" stroke-width="1.5"/>
    <rect x="98.89999999999999" y="196" width="101.10000000000001" height="18" rx="9" fill="#4a6670" stroke="#4a6670" stroke-width="1"/>
    <text x="149.45" y="209" text-anchor="middle" font-family="IBM Plex Mono,Consolas,monospace" font-size="11" font-weight="600" fill="#fff">сенсорна зона</text></g><g class="pin" data-k="1" tabindex="0" role="button" aria-label="Чип TTP223"><title>Чип TTP223: Мікросхема, що вимірює ємність площадки. Після ввімкнення ~0.5 с калібрується: у цей час не тримайте палець на сенсорі, інакше дотик стане для неї «нормою».</title>
    <rect x="370" y="140" width="30" height="18" rx="2" fill="#1a1a1a"/><text x="385" y="152" text-anchor="middle" font-family="IBM Plex Mono,Consolas,monospace" font-size="7" fill="#ccc">223B</text><path d="M400 149 H440" fill="none" stroke="#8b979c" stroke-width="1.5"/>
    <rect x="445" y="140" width="81" height="18" rx="9" fill="#4a6670" stroke="#4a6670" stroke-width="1"/>
    <text x="485.5" y="153" text-anchor="middle" font-family="IBM Plex Mono,Consolas,monospace" font-size="11" font-weight="600" fill="#fff">чип TTP223</text></g><g class="pin" data-k="2" tabindex="0" role="button" aria-label="LED"><title>LED: Світиться, коли вихід I/O активний. Зручно перевірити, чи модуль живий, ще до написання коду. Є не на всіх модулях.</title>
    <rect x="377" y="189" width="16" height="10" rx="2" fill="#ffe1e1" stroke="#8a8f98"/><path d="M393 194 H440" fill="none" stroke="#8b979c" stroke-width="1.5"/>
    <rect x="445" y="185" width="34.1" height="18" rx="9" fill="#4a6670" stroke="#4a6670" stroke-width="1"/>
    <text x="462.05" y="198" text-anchor="middle" font-family="IBM Plex Mono,Consolas,monospace" font-size="11" font-weight="600" fill="#fff">LED</text></g><g class="pin" data-k="3" tabindex="0" role="button" aria-label="Перемичка A"><title>Перемичка A: Розімкнена (заводське): при дотику на I/O буде HIGH. Запаяна: при дотику LOW, у спокої HIGH.</title>
    <rect x="370" y="240" width="10" height="9" fill="#d8b45a"/><rect x="386" y="240" width="10" height="9" fill="#d8b45a"/><text x="362" y="249" text-anchor="end" font-family="IBM Plex Mono,Consolas,monospace" font-size="11" font-weight="600" fill="#fff">A</text><path d="M396 244 H440" fill="none" stroke="#8b979c" stroke-width="1.5"/>
    <rect x="445" y="235" width="94.4" height="18" rx="9" fill="#7b4fd6" stroke="#7b4fd6" stroke-width="1"/>
    <text x="492.2" y="248" text-anchor="middle" font-family="IBM Plex Mono,Consolas,monospace" font-size="11" font-weight="600" fill="#fff">A · інверсія</text></g><g class="pin" data-k="4" tabindex="0" role="button" aria-label="Перемичка B"><title>Перемичка B: Розімкнена (заводське): вихід активний, поки тримаєте палець (як кнопка). Запаяна: перший дотик вмикає, другий вимикає (як вимикач світла).</title>
    <rect x="370" y="275" width="10" height="9" fill="#d8b45a"/><rect x="386" y="275" width="10" height="9" fill="#d8b45a"/><text x="362" y="284" text-anchor="end" font-family="IBM Plex Mono,Consolas,monospace" font-size="11" font-weight="600" fill="#fff">B</text><path d="M396 279 H440" fill="none" stroke="#8b979c" stroke-width="1.5"/>
    <rect x="445" y="270" width="94.4" height="18" rx="9" fill="#7b4fd6" stroke="#7b4fd6" stroke-width="1"/>
    <text x="492.2" y="283" text-anchor="middle" font-family="IBM Plex Mono,Consolas,monospace" font-size="11" font-weight="600" fill="#fff">B · фіксація</text></g><g class="pin" data-k="5" tabindex="0" role="button" aria-label="GND"><title>GND: Земля. З’єднується з будь-яким GND на ESP32. Без спільної землі сигнал «плаває».</title>
    <rect x="278" y="332" width="4" height="40" fill="#d8b45a"/><text x="280" y="310" text-anchor="middle" font-family="IBM Plex Mono,Consolas,monospace" font-size="11" font-weight="600" fill="#fff">GND</text><path d="M280 372 V405 H205" fill="none" stroke="#8b979c" stroke-width="1.5"/>
    <rect x="125.69999999999999" y="396" width="74.30000000000001" height="18" rx="9" fill="#2b3036" stroke="#2b3036" stroke-width="1"/>
    <text x="162.85" y="409" text-anchor="middle" font-family="IBM Plex Mono,Consolas,monospace" font-size="11" font-weight="600" fill="#fff">GND → GND</text></g><g class="pin" data-k="6" tabindex="0" role="button" aria-label="I/O"><title>I/O: Цифровий вихід модуля (на інших платах OUT або SIG). Сам видає 0 або 1, підтяжка не потрібна. На ESP32 іде на будь-який вільний пін, в уроці 1 це D4.</title>
    <rect x="318" y="332" width="4" height="40" fill="#d8b45a"/><text x="320" y="310" text-anchor="middle" font-family="IBM Plex Mono,Consolas,monospace" font-size="11" font-weight="600" fill="#fff">I/O</text><path d="M320 372 V431" fill="none" stroke="#8b979c" stroke-width="1.5"/>
    <rect x="286.2" y="431" width="67.6" height="18" rx="9" fill="#e0a800" stroke="#e0a800" stroke-width="1"/>
    <text x="320" y="444" text-anchor="middle" font-family="IBM Plex Mono,Consolas,monospace" font-size="11" font-weight="600" fill="#1b2327">I/O → D4</text></g><g class="pin" data-k="7" tabindex="0" role="button" aria-label="VCC"><title>VCC: Живлення 2.0–5.5 В. З ESP32 беріть 3V3: тоді й сигнал на I/O буде 3.3 В, безпечний для піна ESP32. Від 5 В вихід теж стане 5-вольтовим.</title>
    <rect x="358" y="332" width="4" height="40" fill="#d8b45a"/><text x="360" y="310" text-anchor="middle" font-family="IBM Plex Mono,Consolas,monospace" font-size="11" font-weight="600" fill="#fff">VCC</text><path d="M360 372 V405 H435" fill="none" stroke="#8b979c" stroke-width="1.5"/>
    <rect x="440" y="396" width="74.30000000000001" height="18" rx="9" fill="#d42a2a" stroke="#d42a2a" stroke-width="1"/>
    <text x="477.15" y="409" text-anchor="middle" font-family="IBM Plex Mono,Consolas,monospace" font-size="11" font-weight="600" fill="#fff">VCC → 3V3</text></g><circle cx="40" cy="478" r="6" fill="#d42a2a"/><text x="52" y="482" class="lbl">живлення</text><circle cx="160" cy="478" r="6" fill="#2b3036"/><text x="172" y="482" class="lbl">земля</text><circle cx="280" cy="478" r="6" fill="#e0a800"/><text x="292" y="482" class="lbl">сигнал</text><circle cx="400" cy="478" r="6" fill="#7b4fd6"/><text x="412" y="482" class="lbl">налаштування</text><circle cx="520" cy="478" r="6" fill="#4a6670"/><text x="532" y="482" class="lbl">деталь</text><text x="40" y="524" class="lbl" font-weight="600">Перемички A і B</text><text x="40" y="552" class="lbl" font-weight="600">A</text><text x="130" y="552" class="lbl" font-weight="600">B</text><text x="230" y="552" class="lbl" font-weight="600">режим</text><text x="430" y="552" class="lbl" font-weight="600">при дотику</text><text x="40" y="574" class="lbl" >—</text><text x="130" y="574" class="lbl" >—</text><text x="230" y="574" class="lbl" >кнопка (поки тримаєш)</text><text x="430" y="574" class="lbl" >HIGH ← заводське</text><text x="40" y="596" class="lbl" >запаяна</text><text x="130" y="596" class="lbl" >—</text><text x="230" y="596" class="lbl" >кнопка (поки тримаєш)</text><text x="430" y="596" class="lbl" >LOW</text><text x="40" y="618" class="lbl" >—</text><text x="130" y="618" class="lbl" >запаяна</text><text x="230" y="618" class="lbl" >вимикач (дотик / дотик)</text><text x="430" y="618" class="lbl" >HIGH</text><text x="40" y="640" class="lbl" >запаяна</text><text x="130" y="640" class="lbl" >запаяна</text><text x="230" y="640" class="lbl" >вимикач (дотик / дотик)</text><text x="430" y="640" class="lbl" >LOW</text></svg>